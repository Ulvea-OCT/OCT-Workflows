name: Roadmap to Project

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Parse and schedule only; do not modify GitHub"
        required: false
        type: boolean
        default: true

    secrets:
      ROADMAP_PROJECT_TOKEN:
        required: true

jobs:
  roadmap:
    name: Compile roadmap
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify organization secret
        shell: bash
        env:
          ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
        run: |
          echo "Token present: ${ROADMAP_PROJECT_TOKEN:+YES}"
          echo "Token length: ${#ROADMAP_PROJECT_TOKEN}"

          curl -sS \
            -o /tmp/user.json \
            -w "HTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $ROADMAP_PROJECT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user

        cat /tmp/user.json

      - name: Verify token in runner
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
        run: |
          echo "Testing token against GitHub API..."
          gh api user
          echo "Testing GraphQL..."
          gh api graphql -f query='{ viewer { login } }'

      - name: Run Roadmap to Project
        uses: Ulvea-OCT/OCT-Workflows/.github/actions/roadmap-to-project@v0.1
        env:
          ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
        with:
          roadmap-files: |
            roadmaps/*.md
          project-owner: Ulvea-OCT
          project-owner-type: organization
          default-repo: ${{ github.repository }}
          dry-run: ${{ inputs.dry_run }}
